name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 同分支新推送取消旧跑，省排队时间

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22] # 库要兼容使用方 node 环境，双版本廉价保险
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage # 含全部测试 + 覆盖率闸门(vite.config thresholds 低于水位即失败)
      - run: npm run build # 验证产物可构建(含 index.d.cts 生成)
      - run: npm pack --dry-run # 打包体检：确认只含 dist + LICENSE + package.json
